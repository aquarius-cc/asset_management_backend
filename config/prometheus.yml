global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "django"
    static_configs:
      - targets: ["web:8000"]
    metrics_path: "/metrics/"
    scrape_interval: 10s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # M-5B 主机资源采集 (node_exporter)
  # 数据源: node_exporter 容器，仅监听内网，不暴露公网
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # N-3 TLS 证书探针 (blackbox file_sd 热加载)
  # targets 由 blackbox-config-renderer 渲染到共享卷
  - job_name: "blackbox"
    metrics_path: /probe
    file_sd_configs:
      - files:
          - "/etc/prometheus/sd/probes.yml"
        refresh_interval: 30s
    params:
      module: [https_health_2xx]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
