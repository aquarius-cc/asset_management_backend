# =============================================================================
# GitHub Actions CI/CD 配置
# =============================================================================
# 自动化测试、代码检查和部署流程

name: CI/CD Pipeline

# =============================================================================
# 触发条件
# =============================================================================
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# =============================================================================
# 环境变量
# =============================================================================
env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: config.settings.test

# =============================================================================
# 任务定义
# =============================================================================
jobs:
  # =============================================================================
  # 代码检查任务
  # =============================================================================
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Ruff
        run: |
          pip install ruff
          ruff check .

      - name: Run MyPy
        run: |
          pip install mypy
          mypy apps core config utils

  # =============================================================================
  # 测试任务
  # =============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: asset_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: asset_management_test
          DB_USER: root
          DB_PASSWORD: rootpassword
        run: |
          python manage.py migrate --settings=config.settings.test

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: asset_management_test
          DB_USER: root
          DB_PASSWORD: rootpassword
        run: |
          python manage.py test --settings=config.settings.test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests

  # =============================================================================
  # 安全扫描
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r apps core config utils -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-report.json

  # =============================================================================
  # Docker 构建（仅在 main 分支）
  # =============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/asset-management-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/asset-management-backend:${{ github.sha }}

  # =============================================================================
  # 部署到预发布环境（仅在 main 分支）
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "部署到预发布环境..."
          # 添加实际部署命令
