groups:
  - name: asset_mgmt_alerts
    rules:
      # 5xx 错误率 > 5% 持续 2 分钟 → 告警
      - alert: HighErrorRate
        expr: |
          sum(rate(asset_mgmt_http_errors_total[5m])) 
          / sum(rate(asset_mgmt_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx 错误率超过 5%"
          description: "过去 5 分钟内 5xx 错误率为 {{ $value | humanizePercentage }}"

      # 请求延迟 P95 > 2s 持续 5 分钟 → 告警
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, 
            sum(rate(asset_mgmt_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 请求延迟超过 2 秒"
          description: "过去 5 分钟 P95 延迟为 {{ $value | humanizeDuration }}"

      # 请求延迟 P99 > 5s 持续 5 分钟 → 告警
      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, 
            sum(rate(asset_mgmt_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "P99 请求延迟超过 5 秒"
          description: "过去 5 分钟 P99 延迟为 {{ $value | humanizeDuration }}"

      # 服务不可用(健康检查失败) 持续 1 分钟 → 告警
      - alert: ServiceDown
        expr: up{job="django"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Django 服务不可用"
          description: "Django 服务已不可达超过 1 分钟"

      # 活跃请求堆积 > 50 持续 3 分钟 → 告警
      - alert: RequestBacklog
        expr: avg_over_time(asset_mgmt_http_active_requests[3m]) > 50
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "请求堆积严重"
          description: "过去 3 分钟平均活跃请求数为 {{ $value }}"

  # M-5A 阶段: 无需新增容器,复用现有 exporter
  - name: asset_mgmt_infrastructure_alerts
    rules:
      # Postgres 不可用
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL 不可用"
          description: "PostgreSQL 服务已不可达超过 1 分钟"

      # Redis 不可用
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis 不可用"
          description: "Redis 服务已不可达超过 1 分钟"

      # PostgreSQL 连接数 > 80% 上限持续 5 分钟 → 告警
      # 数据源: postgres_exporter (已部署)
      - alert: PgConnectionsHigh
        expr: |
          pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 连接数接近上限"
          description: "当前连接数使用率 {{ $value | humanizePercentage }}，建议扩容"
          # 阈值按 M-4 压测基线校准

      # PostgreSQL 数据库大小 > 50GB 持续 10 分钟 → 告警
      - alert: PgDatabaseSizeLarge
        expr: |
          pg_database_size_bytes{dbname=~"asset.*"} > 50 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "数据库体积过大"
          description: "数据库 {{ $labels.dbname }} 当前 {{ $value | humanize }}，超过 50GB 阈值"
          # 阈值按实际容量调整(50GB 为参考值)

      # Redis 客户端连接数 > 100 持续 5 分钟 → 告警
      # 数据源: redis_exporter (已部署)
      - alert: RedisClientsHigh
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 客户端连接数过高"
          description: "当前连接数 {{ $value }}，超过 100 阈值"
          # 阈值按 M-4 压测基线校准

  # M-5B 主机资源告警: 依赖 node_exporter 容器 (已新增到 compose.monitoring.yml)
  # 数据源: node_exporter (host 网络采集, 127.0.0.1:9100)
  - name: asset_mgmt_host_alerts
    rules:
      - alert: HostCpuUsageHigh
        expr: |
          (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "主机 CPU 使用率过高"
          description: "实例 {{ $labels.instance }} CPU 使用率 {{ $value }}% > 80%"

      - alert: HostMemoryLow
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "可用内存过低"
          description: "实例 {{ $labels.instance }} 可用内存比例 {{ $value | humanizePercentage }} < 15%"

      - alert: HostDiskLow
        expr: |
          (node_filesystem_avail_bytes{fstype="ext4",mountpoint=~"/|/data|/app"} / node_filesystem_size_bytes{fstype="ext4",mountpoint=~"/|/data|/app"}) < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "关键分区磁盘空间不足"
          description: "挂载点 {{ $labels.mountpoint }} 可用比例 {{ $value | humanizePercentage }} < 10%"

  # M-5C 备份可观测规则: 依赖备份脚本写入共享卷 textfile 指标 (M-5B 完成 textfile 后启用)
  - name: asset_mgmt_backup_alerts
    rules:
      - alert: BackupOverdue
        expr: time() - backup_last_success_timestamp > 90000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "备份已逾期"
          description: "距离上次成功备份已超过 25 小时 (基线每日 02:00 + 4h 宽限)"

      - alert: BackupFailed
        expr: increase(backup_failures_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "备份执行失败"
          description: "过去 1 小时内备份脚本返回非零退出码"

  # M-5D 证书到期告警: 依赖 blackbox_exporter (M-5B 完成后部署)
  - name: asset_mgmt_tls_alerts
    rules:
      - alert: TlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "TLS 证书即将到期"
          description: "证书剩余有效期 {{ $value | humanizeDuration }} < 14 天"

      - alert: TlsCertExpiringCritical
        expr: probe_ssl_earliest_cert_expiry - time() < 7 * 86400
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "TLS 证书即将过期（危险）"
          description: "证书剩余有效期 {{ $value | humanizeDuration }} < 7 天"

# M-5 执行顺序 (修订版 A→B→C→D)
# A 阶段: 纯规则增量 (已实施)
# B 阶段: node_exporter 已部署 (已实施)
# C 阶段: backup_status.sh + textfile collector (N-2, 已实施)
# D 阶段: blackbox_exporter 部署 (N-3, 本次部署后启用)

# N-3 数据源自活守卫: 探针/采集链路自身故障时报警, 防止"规则静默休眠"复发
- name: asset_mgmt_probe_health_alerts
  rules:
    - alert: BlackboxTargetDown
      expr: probe_success == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "TLS 健康探针探测失败"
        description: "{{ $labels.instance }}/health/ 探测非 2xx 或超时超过 10 分钟"

    - alert: BlackboxExporterDown
      expr: up{job="blackbox"} == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "blackbox_exporter 不可用"
        description: "TLS 证书监控数据源中断"

    - alert: TlsCertMetricMissing
      expr: absent(probe_ssl_earliest_cert_expiry)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "证书到期指标缺失（探针链路未生效）"
        description: "30 分钟内未采集到任何 probe_ssl_earliest_cert_expiry 样本，证书告警处于静默休眠"
