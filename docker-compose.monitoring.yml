# 监控基础设施: Prometheus + Grafana + Alertmanager
# 依据: Project_Requirements/03-安全与运维/10-监控告警SOP.md §3
#
# ⚠️ 运维前提:
#   1. 主 docker-compose.yml 必须先启动(创建 asset-network)
#   2. 启动方式: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   3. 不可独立启动(postgres-exporter/redis-exporter 因 DNS 无法解析而失败)
services:
  prometheus:
    image: prom/prometheus:v2.53.3
    ports: ["127.0.0.1:9090:9090"]
    networks:
      - asset-network
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    ports: ["127.0.0.1:3000:3000"]
    networks:
      - asset-network
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?请在 .env 中设置 GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?请在 .env 中设置 GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/provisioning/dashboards/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:0.16.0
    ports: ["127.0.0.1:9187:9187"]
    networks:
      - asset-network
    environment:
      # sslmode=disable 为 docker 内网有意选择(docker 网络不支持 TLS)
      # DB_HOST/DB_USER/DB_PASSWORD 必须与主 docker-compose.yml 中 postgres 服务一致
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@${DB_HOST:-postgres}:5432/${DB_NAME:-asset_management}?sslmode=disable"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    ports: ["127.0.0.1:9121:9121"]
    networks:
      - asset-network
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["127.0.0.1:9093:9093"]
    networks:
      - asset-network
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  grafana-data:
  alertmanager-data:

networks:
  asset-network:
    external: true
