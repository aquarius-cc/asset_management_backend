# =============================================================================
# Nginx 主配置 - 资产管理系统反向代理
# =============================================================================
# 功能: Gzip压缩 / 安全头 / Rate Limiting / Upstream长连接
# 注意: server 块在 conf.d/default.conf 中定义

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- 日志格式 ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # --- 性能优化 ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- 请求大小限制 (与 Django FILE_UPLOAD_MAX_MEMORY_SIZE=10MB 对齐) ---
    client_max_body_size 10m;

    # --- Gzip 压缩 ---
    gzip on;
    # 【BF-004】优先下发构建期预压缩产物(vite-plugin-compression 生成的同名 .gz),
    # 省去实时压缩 CPU 开销; 无 .gz 的文件自动回落到上面的运行时 gzip
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # --- Rate Limiting Zones ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # M-1 独立限流区：登录爆破防护（与 token/refresh/verify 隔离预算）
    limit_req_zone $binary_remote_addr zone=login_brute:10m rate=5r/m;

    # --- Upstream (HTTP长连接复用) ---
    upstream asset_backend {
        server web:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
