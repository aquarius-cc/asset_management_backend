# Alertmanager 告警路由配置
# 注意: 本文件为 volume 挂载的静态配置, 不支持环境变量插值。
# 告警经内网 feishu-adapter 容器转换为飞书卡片(H-3, 2026-08-26);
# 飞书机器人 webhook URL 与加签密钥存于 .env(SC-1), 由适配器容器读取,
# 严禁将真实凭据写入本文件。修改本文件后需重启 alertmanager 生效:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml restart alertmanager

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # v0.27 已移除遗留 match 字段, 使用 matchers 语法
    - matchers:
        - severity="critical"
      receiver: critical
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: default
      repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: "http://feishu-adapter:9095/alertmanager"
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: "http://feishu-adapter:9095/alertmanager"
        send_resolved: true
