# 监控基础设施: Prometheus + Grafana + Alertmanager
# 依据: Project_Requirements/03-安全与运维/10-监控告警SOP.md §3
#
# ⚠️ 运维前提:
#   1. 主 docker-compose.yml 必须先启动(创建 asset-network)
#   2. 启动方式: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   3. 不可独立启动(postgres-exporter/redis-exporter 因 DNS 无法解析而失败)
services:
  prometheus:
    image: prom/prometheus:v2.53.3
    ports: ["127.0.0.1:9090:9090"]
    networks:
      - asset-network
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - blackbox_rendered:/etc/prometheus/sd:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    ports: ["127.0.0.1:3000:3000"]
    networks:
      - asset-network
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?请在 .env 中设置 GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?请在 .env 中设置 GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/provisioning/dashboards/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:0.16.0
    ports: ["127.0.0.1:9187:9187"]
    networks:
      - asset-network
    environment:
      # sslmode=disable 为 docker 内网有意选择(docker 网络不支持 TLS)
      # DB_HOST/DB_USER/DB_PASSWORD 必须与主 docker-compose.yml 中 postgres 服务一致
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@${DB_HOST:-postgres}:5432/${DB_NAME:-asset_management}?sslmode=disable"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    ports: ["127.0.0.1:9121:9121"]
    networks:
      - asset-network
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # M-5B 主机资源采集(node_exporter): 提供 CPU/内存/磁盘数据源供资源告警
  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports: ["127.0.0.1:9100:9100"]
    networks:
      - asset-network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - backup_status_data:/textfile:ro  # N-2 备份状态指标共享
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.textfile.directory=/textfile"  # N-2 启用 textfile 采集
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["127.0.0.1:9093:9093"]
    networks:
      - asset-network
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    depends_on:
      - feishu-adapter
    restart: unless-stopped

  # 飞书告警适配器(H-3): Alertmanager webhook payload → 飞书交互卡片
  # 密钥经 .env 注入(SC-1), 仅需出站 HTTPS, 无入站端口暴露
  # 注意: FEISHU_WEBHOOK_URL 未设置时本服务拒绝启动(compose 必填校验)
  feishu-adapter:
    build: ./docker/feishu-webhook
    networks:
      - asset-network
    environment:
      FEISHU_WEBHOOK_URL: "${FEISHU_WEBHOOK_URL:?请在 .env 中设置 FEISHU_WEBHOOK_URL}"
      FEISHU_SECRET: "${FEISHU_SECRET:-}"
      ADAPTER_PORT: "9095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=3)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # N-3 TLS 证书探针: blackbox + 域名渲染边车
  blackbox-config-renderer:
    build:
      context: ..
      dockerfile: asset_management_backend/docker/blackbox/Dockerfile
    image: blackbox-config-renderer:local
    environment:
      - DOMAIN=${DOMAIN:-}
    volumes:
      - blackbox_rendered:/rendered
    depends_on:
      - blackbox
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    ports: ["127.0.0.1:9115:9115"]
    networks:
      - asset-network
    volumes:
      - blackbox_rendered:/config:ro
    command: ["--config.file=/config/blackbox.yml"]
    restart: unless-stopped

volumes:
  grafana-data:
  alertmanager-data:
  blackbox_rendered:
    driver: local

networks:
  asset-network:
    external: true
