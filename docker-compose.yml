# =============================================================================
# Docker Compose 配置 - 资产管理系统开发/生产环境
# =============================================================================
# 使用方法：
#   开发环境：docker-compose up -d
#   生产环境：docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # =============================================================================
  # Django 应用服务
  # =============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # 【易错点】生产环境使用预构建镜像
    # image: asset-management-backend:latest
    container_name: asset-management-web
    restart: unless-stopped
    # 【注意】生产环境不暴露8000端口, 由 Nginx 反向代理
    # ports:
    #   - "8000:8000"
    # WebSocket 长连接需要足够时间优雅关闭
    stop_grace_period: 30s
    environment:
      # 数据库配置（连接 PostgreSQL 服务）
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-asset_management_backend}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Django 配置
      - DJANGO_SETTINGS_MODULE=config.settings.production
      # 【安全】生产环境必须显式设置 SECRET_KEY，缺失时 Django 启动失败
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Redis 配置（WebSocket 通道层）
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      # 静态文件挂载
      - static_volume:/app/staticfiles
      # 媒体文件挂载
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - asset-network

  # =============================================================================
  # PostgreSQL 数据库服务
  # =============================================================================
  postgres:
    image: postgres:16
    container_name: asset-management-postgres
    restart: unless-stopped
    environment:
      # 必须在 .env 中显式设置,禁止使用弱默认值(未设置时 docker-compose 报错退出)
      - POSTGRES_PASSWORD=${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD 环境变量}
      - POSTGRES_USER=${DB_USER:?请在 .env 中设置 DB_USER 环境变量}
      - POSTGRES_DB=${DB_NAME:?请在 .env 中设置 DB_NAME 环境变量}
    # 仅允许宿主机本地访问,禁止外部网络连接数据库
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # 数据卷挂载（持久化数据）
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（可选）
      # - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - asset-network

  # =============================================================================
  # Redis 缓存服务（WebSocket 通道层）
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: asset-management-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - asset-network

  # =============================================================================
  # Nginx 反向代理 + TLS 终结
  # =============================================================================
  nginx:
    build:
      context: ..
      dockerfile: asset_management_backend/docker/nginx/Dockerfile
    container_name: asset-management-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - CERT_PATH=/etc/nginx/letsencrypt
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - letsencrypt-certs:/etc/nginx/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      web:
        condition: service_healthy
    networks:
      - asset-network

  # =============================================================================
  # Certbot 证书签发/续期 Sidecar
  # =============================================================================
  certbot:
    build:
      context: ..
      dockerfile: asset_management_backend/docker/nginx/certbot/Dockerfile
    container_name: asset-management-certbot
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - asset-network

  # =============================================================================
  # 数据库自动备份（容器内 cron, 不依赖宿主机 crontab）
  # =============================================================================
  backup:
    build:
      context: ..
      dockerfile: asset_management_backend/docker/backup/Dockerfile
    container_name: asset-management-backup
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-asset_management_backend}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      - BACKUP_DIR=/data/backups/postgres
      - BACKUP_DIR_REDIS=/data/backups/redis
      - BACKUP_DIR_MEDIA=/data/backups/media
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - MEDIA_SRC=/data/media
      - REDIS_HOST=redis
      # Redis 认证(与生产 compose 的 REDIS_PASSWORD 同源; 未设置时脚本降级为无认证访问)
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # S3 异地备份(可选: 未配置 S3_BUCKET 时仅本地保留, 不强制要求凭据)
      - S3_BUCKET=${S3_BUCKET:-}
      # N-2 备份可观测状态卷
      - BACKUP_STATUS_DIR=/data/backup_status
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${S3_REGION:-ap-east-1}
    volumes:
      - backup_data:/data/backups/postgres
      - redis_backup_data:/data/backups/redis
      - media_backup_data:/data/backups/media
      - restore_report_data:/tmp/restore_test_results
      # 媒体源目录: 只读挂载, 备份容器无写权限(最小权限原则)
      - media_volume:/data/media:ro
      - backup_status_data:/data/backup_status
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asset-network

# =============================================================================
# 数据卷配置
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  letsencrypt-certs:
    driver: local
  certbot-webroot:
    driver: local
  backup_data:
    driver: local
  redis_backup_data:
    driver: local
  media_backup_data:
    driver: local
  restore_report_data:
    driver: local
  backup_status_data:
    driver: local

# =============================================================================
# 网络配置
# =============================================================================
networks:
  asset-network:
    name: asset-network
    driver: bridge
