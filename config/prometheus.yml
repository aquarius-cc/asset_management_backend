global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "django"
    static_configs:
      - targets: ["web:8000"]
    metrics_path: "/metrics/"
    scrape_interval: 10s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # M-5B 主机资源采集 (node_exporter)
  # 数据源: node_exporter 容器，仅监听内网，不暴露公网
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
