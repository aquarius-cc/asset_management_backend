[coverage:run]
source =
    apps.assetmanagement
    apps.authusermanagement
    apps.usermanagement
    apps.notification
    apps.unregisteredasset
    core
omit =
    */tests/*
    */admin/*
    */migrations/*
    */management/*
    */apps.py

[coverage:report]
show_missing = true
fail_under = 80

[mutmut]
# 变异测试配置（T7 相对基线不回归，基线见 mutmut-baseline.json）。唯一事实源：CI 的 `mutmut run` 不传任何 CLI 参数，
# 本地与 CI 共用本段，消除双口径。
#
# 【易错点 1】本段仅在 pyproject.toml 无 [tool.mutmut] 时才生效。
#   configuration.py:61-72 优先读取 pyproject.toml 的 [tool.mutmut]，一旦该节存在
#   即整段跳过 setup.cfg。本仓 pyproject.toml 当前无该节，故落到此处；
#   若日后有人往 pyproject.toml 加 [tool.mutmut]，本段会静默失效。
#
# 【易错点 2】list 型键必须「每行一个」书写。configuration.py:94-98 仅按 \n 切分，
#   单行写法（如 `pytest_add_cli_args = -x --assert=plain`）会产出含空格的
#   单元素列表，pytest.main() 解析该 argv 必然失败。
#
# 【易错点 3】mutants/ 内只有 source_paths + also_copy 的内容，而
#   setup_source_paths()（file_utils.py:88-92）会把仓库根从 sys.path 移除。
#   因此测试运行所需的一切可导入代码都必须显式 also_copy，否则 mutants 环境下
#   直接 import 崩溃（不是「全部判 untested」）。
#   - apps/core/config/utils 覆盖测试的跨 app 导入与 config.settings.test；
#   - conftest.py/pytest.ini 不在 mutmut 默认 also_copy 集内，必须显式补。
#
# 【易错点 4】mutmut 拒绝在 Windows 原生运行（__main__.py:14-19 直接 sys.exit(1)），
#   本配置只能在 CI（ubuntu-latest）或 WSL 下实跑。
#
# 【易错点 5】manage.py 不是可选项。删掉它，变异测试会「静默失真」——不报错、
#   测试全过，但分数完全无意义。这是 mutmut 3.8.0 首跑最隐蔽的一个坑。
#   机制：pytest-django 4.12 的 _add_django_project_to_path（plugin.py:192-225）
#   从 cwd（= mutants/，绝对路径）逐级向上找含 manage.py 的目录，命中即
#   sys.path.insert(0, 该目录)。mutants/ 内若无 manage.py，则命中【外层仓库根】，
#   把未变异的原始代码插到 sys.path 最前。
#   时序：该动作在 pytest_load_initial_conftests（early）→ django.setup() 内完成，
#   早于 mutants/conftest.py 插入 mutants 路径；此刻 sys.modules['apps'] 已被
#   钉死在外层，之后再改 sys.path 顺序也不再生效。
#   症状：mutmut run 报 "Stopping early, because we could not find any test case
#   for any mutant"，而 pytest 侧 955 个测试全部通过——测试执行的是外层原版
#   代码，零变异命中。
#   旁证：2.5.1 未复现（当时确实产出 1385 只变异体），差异原因未查证。
#   验证：mutmut print-time-estimates（约 20 秒，不跑变异体）。
#   判据：输出无上述 Stopping early 文案，且条目非空。
#   详见活账本 BF-065 §五。

# 变异范围：只变异 assetmanagement 的 Service 层，与 T7 / 变异基线口径一致
source_paths =
    apps/assetmanagement/services

# 传递给 pytest 的全局参数（--ds 覆盖 pytest.ini 的 config.settings.development，
# 指向 sqlite :memory:，避免变异测试污染 development 库）
pytest_add_cli_args =
    -x
    --assert=plain
    --ds=config.settings.test

# 测试选择集：本仓无顶层 tests/，测试全部位于 apps/*/tests/
pytest_add_cli_args_test_selection =
    apps/assetmanagement/tests

# 补齐 mutants/ 运行环境所需的文件（见易错点 3）
also_copy =
    apps
    core
    config
    utils
    conftest.py
    pytest.ini
    manage.py
