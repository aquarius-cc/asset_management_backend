# =============================================================================
# Docker Compose 生产环境覆盖配置
# =============================================================================
# ⚠️ 此文件不能独立运行，必须与 docker-compose.yml 配合使用：
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 此文件覆盖开发配置，提供生产级安全和性能设置。
# 所有密钥必须通过 .env 文件或 CI/CD 环境变量注入。
# =============================================================================

services:
  web:
    image: asset-management-backend:latest
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mysql:
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
