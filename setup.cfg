[coverage:run]
source = apps/assetmanagement
omit =
    apps/assetmanagement/tests/*
    apps/assetmanagement/admin/*
    apps/assetmanagement/migrations/*
    apps/assetmanagement/management/*
    apps/assetmanagement/models.py
    apps/assetmanagement/selectors.py
    apps/assetmanagement/services.py
    apps/assetmanagement/apps.py
    apps/assetmanagement/interfaces.py

[coverage:report]
show_missing = true
fail_under = 80
